name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact_name: code-nav-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact_name: code-nav-darwin-arm64
          - os: macos-13
            target: bun-darwin-x64
            artifact_name: code-nav-darwin-x64
          - os: windows-latest
            target: bun-windows-x64
            artifact_name: code-nav-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compile Standalone Binary
        shell: bash
        run: |
          mkdir -p dist
          bun build --compile --target=${{ matrix.target }} src/index.ts --outfile dist/${{ matrix.artifact_name }}

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
